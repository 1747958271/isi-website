<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大肥鱼 控制台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; background: radial-gradient(80% 60% at 50% 0%, #17233a, #070b14 70%);
    color: #e7eefc; font-family: -apple-system, "Microsoft YaHei", sans-serif; padding: 20px;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 430px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8fa0c0; font-size: 12px; margin-bottom: 18px; }
  .card {
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px; padding: 18px 20px; margin-bottom: 14px;
  }
  .lamp { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; border-top: 1px solid rgba(255,255,255,.07); }
  .row span { color: #93a1c0; }
  .row b { color: #e7eefc; font-weight: 600; }
  .qrbox { text-align: center; }
  .qrbox img { width: 100%; max-width: 260px; background: #fff; padding: 10px; border-radius: 12px; }
  .qrhint { color: #f0b429; font-size: 12.5px; margin-bottom: 10px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .btn {
    display: block; text-align: center; text-decoration: none; padding: 13px 8px;
    border-radius: 12px; font-size: 14px; font-weight: 600; color: #e7eefc;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  }
  .btn:active { transform: scale(.98); }
  .btn.blue { background: rgba(79,124,255,.22); border-color: rgba(79,124,255,.5); }
  .btn.red { background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.45); }
  .btn.green { background: rgba(34,197,94,.18); border-color: rgba(34,197,94,.45); }
  .btn.full { grid-column: 1 / -1; }
  .note { margin-top: 12px; font-size: 11.5px; color: #5f7599; line-height: 1.7; }
  .refresh { color: #22d3ee; font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>大肥鱼 · 控制台</h1>
  <div class="sub">手机每 60 秒上报 · <a class="refresh" href="">刷新</a></div>

  <div class="card" id="statusCard">
    <div class="lamp" id="lamp">读取中…</div>
    <div class="row"><span>QQ 登录</span><b id="qq">-</b></div>
    <div class="row"><span>AstrBot</span><b id="astrbot">-</b></div>
    <div class="row"><span>自己刷手机</span><b id="play">-</b></div>
    <div class="row"><span>最后活跃</span><b id="last">-</b></div>
    <div class="row"><span>手机电量</span><b id="battery">-</b></div>
    <div class="row"><span>上报时间</span><b id="time">-</b></div>
  </div>

  <div class="card qrbox" id="qrCard" style="display:none">
    <div class="qrhint">⚠️ QQ 未登录，用手机 QQ 扫这个码登录</div>
    <img id="qrImg" alt="QQ 登录二维码">
    <div class="note">长按保存二维码 → 手机 QQ「扫一扫」→ 右上角相册选图</div>
  </div>

  <div class="card">
    <div class="btns">
      <a class="btn blue" id="btnStatus" href="#">查状态</a>
      <a class="btn" id="btnRq" href="#">重启 QQ</a>
      <a class="btn" id="btnRa" href="#">重启 AstrBot</a>
      <a class="btn green" id="btnStart" href="#">开始刷手机</a>
      <a class="btn" id="btnStop" href="#">停止刷手机</a>
      <a class="btn red" id="btnOff" href="#">一键下线</a>
      <a class="btn green full" id="btnOn" href="#">重新上线</a>
    </div>
    <div class="note">
      按钮会在新页面打开 GitHub 提交指令；点「Submit new issue」即可，手机 15 秒内执行，结果会评论在 issue 里。
    </div>
  </div>
</div>
<script>
  const OWNER = '1747958271', REPO = 'isi-website';
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/control/`;

  function issueUrl(cmd) {
    return `https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent('cmd:' + cmd)}&labels=cmd&body=${encodeURIComponent('点 Submit new issue 提交')}`;
  }
  document.getElementById('btnStatus').href = issueUrl('status');
  document.getElementById('btnRq').href = issueUrl('restart-qq');
  document.getElementById('btnRa').href = issueUrl('restart-astrbot');
  document.getElementById('btnStart').href = issueUrl('start-play');
  document.getElementById('btnStop').href = issueUrl('stop-play');
  document.getElementById('btnOff').href = issueUrl('offline');
  document.getElementById('btnOn').href = issueUrl('online');

  async function load() {
    try {
      const r = await fetch(RAW + 'status.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const s = await r.json();
      const lamp = document.getElementById('lamp');
      lamp.textContent = s.online ? '🟢 在线' : '🔴 离线';
      lamp.style.color = s.online ? '#22c55e' : '#ef4444';
      document.getElementById('qq').textContent = s.online ? '已登录' : '未登录';
      document.getElementById('astrbot').textContent = s.astrbot ? '运行中' : '已停';
      document.getElementById('play').textContent = s.play ? '运行中' : '已停';
      document.getElementById('last').textContent = s.last_active || '-';
      document.getElementById('battery').textContent = s.battery || '-';
      document.getElementById('time').textContent = s.time || '-';
      const qrCard = document.getElementById('qrCard');
      if (!s.online) {
        qrCard.style.display = 'block';
        document.getElementById('qrImg').src = RAW + 'qr.png?t=' + Date.now();
      } else {
        qrCard.style.display = 'none';
      }
    } catch (e) {
      document.getElementById('lamp').textContent = '读取失败';
      document.getElementById('lamp').style.color = '#f0b429';
      console.error(e);
    }
  }
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
